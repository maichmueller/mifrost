name: Docs Check

on:
  pull_request:
  workflow_dispatch:

jobs:
  docs-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install docs dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r docs/requirements.txt

      - name: Guard legacy naming
        run: |
          if git grep -n -i "[b][i][f][r][o][s][t]" -- .; then
            echo "Legacy repository name detected in tracked files."
            exit 1
          fi

      - name: Build docs strictly
        run: mkdocs build --strict
