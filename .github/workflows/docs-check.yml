name: Docs Check

on:
  pull_request:
  push:
    branches:
      - "**"
  workflow_dispatch:

env:
  # Both sides of the MkDocs 2.0 dispute print an advocacy banner on every
  # `mkdocs` invocation: properdocs (pulled in by mkdocs-gen-files,
  # mkdocs-literate-nav and mkdocs-section-index) urges switching away from
  # mkdocs, and mkdocs-material warns against MkDocs 2.0. We stay on mkdocs 1.x
  # with the Material theme, so silence both rather than clutter build logs.
  DISABLE_MKDOCS_2_WARNING: "true"
  NO_MKDOCS_2_WARNING: "true"

jobs:
  docs-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install docs dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r docs/requirements.txt

      - name: Generate snippet includes (no-exec)
        run: python docs/_scripts/generate_snippet_includes.py --no-exec

      - name: Build docs strictly
        run: mkdocs build --strict
