name: Docs Check

on:
  pull_request:
  push:
    branches:
      - "**"
  workflow_dispatch:

jobs:
  docs-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install docs dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r docs/requirements.txt

      - name: Generate snippet includes (no-exec)
        run: python docs/_scripts/generate_snippet_includes.py --no-exec

      - name: Build docs strictly
        run: mkdocs build --strict
