name: Unit & C++ Tests

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - "**"

env:
  MIFROST_MACOSX_DEPLOYMENT_TARGET: "11.0"

jobs:
  quality:
    name: Quality (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install quality dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt "ruff>=0.14.14,<0.15"

      - name: Run Ruff lint
        run: python -m ruff check .

      - name: Check Ruff format
        run: python -m ruff format --check .

  test:
    name: Tests (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.allow_failure }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            python-version: "3.12"
            backends: both
            allow_failure: false
          - os: macos-latest
            python-version: "3.13"
            backends: both
            allow_failure: false
          - os: macos-latest
            python-version: "3.14"
            backends: pymimir
            allow_failure: false
          - os: ubuntu-latest
            python-version: "3.12"
            backends: both
            allow_failure: false
          - os: ubuntu-latest
            python-version: "3.13"
            backends: both
            allow_failure: false
          - os: ubuntu-latest
            python-version: "3.14"
            backends: pymimir
            allow_failure: false

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set Conan cache dir
        run: |
          echo "CONAN_HOME=$GITHUB_WORKSPACE/.conan2" >> $GITHUB_ENV

      - name: Restore Conan cache
        id: conan_cache_restore
        uses: actions/cache/restore@v5
        with:
          path: ${{ env.CONAN_HOME }}
          key: conan-${{ runner.os }}-${{ runner.arch }}-${{ runner.os == 'macOS' && env.MIFROST_MACOSX_DEPLOYMENT_TARGET || 'none' }}-${{ hashFiles('conanfile.py', 'conandata.yml', 'conan_export.py') }}
          restore-keys: |
            conan-${{ runner.os }}-${{ runner.arch }}-${{ runner.os == 'macOS' && env.MIFROST_MACOSX_DEPLOYMENT_TARGET || 'none' }}-
            conan-${{ runner.os }}-${{ runner.arch }}-

      - name: Install test dependency
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements/base-build.txt -r requirements/test.txt -r requirements.txt pymimir==0.13.63
          if [ "${{ matrix.backends }}" = "both" ]; then
            python -m pip install pytyr==0.0.30
          fi

      - name: Build and install
        id: build_install
        env:
          MIFROST_BUILD_BACKENDS: ${{ matrix.backends }}
        run: |
          python -m pip install -c requirements/constraints-ci.txt --no-build-isolation --verbose .

      - name: Run Python tests
        run: |
          if [ "${{ matrix.backends }}" = "both" ]; then
            python -m pytest -q
          else
            python -m pytest -q --ignore=tests/backends --ignore=tests/encoding/test_semantic_color_encoder.py
          fi

      - name: Build C++ tests
        id: build_cpp_tests
        env:
          MIFROST_BUILD_BACKENDS: ${{ matrix.backends }}
        run: |
          python configure.py --mode ci --backends "${{ matrix.backends }}"
          python cbuild.py --mode ci

      - name: Run C++ tests
        run: ctest --test-dir build/ci -R mifrost_tests --output-on-failure

      - name: Save Conan cache
        if: >-
          always() &&
          steps.conan_cache_restore.outcome == 'success' &&
          steps.build_install.outcome == 'success' &&
          steps.build_cpp_tests.outcome == 'success' &&
          matrix.python-version == '3.12' &&
          steps.conan_cache_restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: ${{ env.CONAN_HOME }}
          key: ${{ steps.conan_cache_restore.outputs.cache-primary-key }}
