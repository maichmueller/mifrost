name: Docs Deploy (wheel + snippets)

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build_wheel:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install conan cmake ninja pymimir scikit-build-core nanobind
          echo "MIFROST_MIMIR_CMAKE_DIR=$(python -c 'import pymimir; print(pymimir.get_cmake_dir())')" >> "$GITHUB_ENV"

      - name: Build wheel
        env:
          CONAN_COMMAND: conan
        run: python -m pip wheel . -w wheelhouse --no-deps --no-build-isolation

      - name: Upload wheel artifact
        uses: actions/upload-artifact@v4
        with:
          name: mifrost-wheel
          path: wheelhouse/*.whl

  snippet_tests:
    runs-on: ubuntu-latest
    needs: [build_wheel]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Download wheel artifact
        uses: actions/download-artifact@v4
        with:
          name: mifrost-wheel
          path: wheelhouse

      - name: Install runtime dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pymimir
          python -m pip install wheelhouse/*.whl

      - name: Sanity import
        run: python -c "import mifrost, pymimir; print('ok')"

      - name: Generate snippet includes (exec)
        run: python docs/_scripts/generate_snippet_includes.py

      - name: Upload snippet includes
        uses: actions/upload-artifact@v4
        with:
          name: mifrost-snippet-includes
          path: docs/_includes

  deploy_docs:
    runs-on: ubuntu-latest
    needs: [snippet_tests]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Download snippet includes
        uses: actions/download-artifact@v4
        with:
          name: mifrost-snippet-includes
          path: docs

      - name: Install docs dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r docs/requirements.txt

      - name: Configure Git author
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Deploy docs with mike
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
            mike deploy --push --update-aliases "${VERSION}" latest
            mike set-default --push latest
          else
            mike deploy --push dev
            mike set-default --push dev
          fi
