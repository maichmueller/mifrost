name: Docs Deploy

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build_wheel:
    name: Build Wheel Artifact
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Set Conan cache dir
        run: echo "CONAN_HOME=$GITHUB_WORKSPACE/.conan2" >> $GITHUB_ENV

      - name: Restore Conan cache
        id: conan_cache_restore
        uses: actions/cache/restore@v5
        with:
          path: ${{ env.CONAN_HOME }}
          key: conan-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('conanfile.py', 'conandata.yml', 'conan_export.py') }}
          restore-keys: |
            conan-${{ runner.os }}-${{ runner.arch }}-

      - name: Install tooling
        run: |
          python -m pip install --upgrade pip

      - name: Build wheel
        id: build_wheel
        run: python -m pip wheel . -w wheelhouse --no-deps

      - name: Save Conan cache
        if: always() && steps.conan_cache_restore.outcome == 'success' && steps.build_wheel.outcome == 'success'
        uses: actions/cache/save@v5
        with:
          path: ${{ env.CONAN_HOME }}
          key: ${{ steps.conan_cache_restore.outputs.cache-primary-key }}

      - name: Upload wheel artifact
        uses: actions/upload-artifact@v6
        with:
          name: mifrost-wheel
          path: wheelhouse/*.whl

  snippet_tests:
    name: Validate Snippets
    runs-on: ubuntu-latest
    needs: [build_wheel]
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Download wheel artifact
        uses: actions/download-artifact@v7
        with:
          name: mifrost-wheel
          path: wheelhouse

      - name: Install runtime dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -c requirements/constraints-ci.txt -r requirements.txt
          python -m pip install wheelhouse/*.whl

      - name: Sanity import
        run: python -c "import mifrost, pymimir; print('ok')"

      - name: Generate snippet includes (exec)
        run: python docs/_scripts/generate_snippet_includes.py

      - name: Upload snippet includes
        uses: actions/upload-artifact@v6
        with:
          name: mifrost-snippet-includes
          path: docs/_includes

  deploy_docs:
    name: Publish Docs
    runs-on: ubuntu-latest
    needs: [snippet_tests]
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Download snippet includes
        uses: actions/download-artifact@v7
        with:
          name: mifrost-snippet-includes
          path: docs

      - name: Install docs dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r docs/requirements.txt

      - name: Configure Git author
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Deploy docs with mike
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
            mike deploy --push --update-aliases "${VERSION}" latest
            mike set-default --push latest
          else
            mike deploy --push dev
            mike set-default --push dev
          fi
