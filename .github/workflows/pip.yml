name: Install Smoke

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - "**"

env:
  MIFROST_MACOSX_DEPLOYMENT_TARGET: "11.0"

jobs:
  smoke:
    name: Install smoke (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.allow_failure }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            python-version: "3.12"
            backends: both
            allow_failure: false
          - os: macos-latest
            python-version: "3.13"
            backends: both
            allow_failure: false
          - os: macos-latest
            python-version: "3.14"
            backends: pymimir
            allow_failure: false
          - os: ubuntu-latest
            python-version: "3.12"
            backends: both
            allow_failure: false
          - os: ubuntu-latest
            python-version: "3.13"
            backends: both
            allow_failure: false
          - os: ubuntu-latest
            python-version: "3.14"
            backends: pymimir
            allow_failure: false

    steps:
    - uses: actions/checkout@v7

    - uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python-version }}

    - name: Set Conan cache dir
      run: echo "CONAN_HOME=$GITHUB_WORKSPACE/.conan2" >> $GITHUB_ENV
      shell: bash

    - name: Restore Conan cache
      id: conan_cache_restore
      uses: actions/cache/restore@v6

      with:
        path: ${{ env.CONAN_HOME }}
        key: conan-${{ runner.os }}-${{ runner.arch }}-${{ runner.os == 'macOS' && env.MIFROST_MACOSX_DEPLOYMENT_TARGET || 'none' }}-${{ hashFiles('conanfile.py', 'conandata.yml', 'conan_export.py') }}
        restore-keys: |
          conan-${{ runner.os }}-${{ runner.arch }}-${{ runner.os == 'macOS' && env.MIFROST_MACOSX_DEPLOYMENT_TARGET || 'none' }}-
          conan-${{ runner.os }}-${{ runner.arch }}-

    - name: Set min macOS version
      if: runner.os == 'macOS'
      run: |
        echo "MACOSX_DEPLOYMENT_TARGET=${MIFROST_MACOSX_DEPLOYMENT_TARGET}" >> $GITHUB_ENV

    - name: Install build/runtime dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install -c requirements/constraints-ci.txt -r requirements/base-build.txt -r requirements.txt pymimir==0.13.63
        if [ "${{ matrix.backends }}" = "both" ]; then
          # See tests.yml: pytyr's transitive deps must not float past the
          # versions its extension was built against.
          python -m pip install -c requirements/constraints-ci.txt pytyr==0.0.34
        fi

    - name: Build and install
      id: build_install
      env:
        MIFROST_BUILD_BACKENDS: ${{ matrix.backends }}
      run: |
        python -m pip install -c requirements/constraints-ci.txt --no-build-isolation --verbose .

    - name: Smoke check
      run: |
        python - <<'PY'
        from pathlib import Path

        import mifrost
        import pymimir

        print("pymimir version:", getattr(pymimir, "__version__", "unknown"))
        print("pymimir path:", Path(pymimir.__file__).resolve())
        print("mifrost version:", getattr(mifrost, "__version__", "unknown"))
        print("mifrost path:", Path(mifrost.__file__).resolve())

        include_dir = Path(mifrost.get_include_dir()).resolve()
        library_dir = Path(mifrost.get_library_dir()).resolve()
        cmake_dir = Path(mifrost.get_cmake_dir()).resolve()

        print("include dir:", include_dir)
        print("library dir:", library_dir)
        print("cmake dir:", cmake_dir)

        assert include_dir.is_dir()
        assert library_dir.is_dir()
        assert cmake_dir.is_dir()
        assert (include_dir / "mifrost" / "core" / "batch_builder.hpp").is_file()
        assert (cmake_dir / "mifrostConfig.cmake").is_file()
        assert (cmake_dir / "mifrostTargets.cmake").is_file()
        assert any(
            path.name.startswith("libmifrost_core") for path in library_dir.iterdir()
        )
        PY
