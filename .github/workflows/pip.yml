name: Pip

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - master

env:
  MIFROST_MACOSX_DEPLOYMENT_TARGET: "11.0"

jobs:
  build:
    name: Build with Pip
    runs-on: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        platform: [ macos-latest, ubuntu-latest ]
        python-version: [ "3.10", "3.11", "3.12", "3.13",  "3.14" ]

    steps:
    - uses: actions/checkout@v6

    - uses: actions/setup-python@v6
      with:
        python-version: ${{ matrix.python-version }}

    - name: Set Conan cache dir (macOS)
      if: runner.os == 'macOS'
      run: echo "CONAN_HOME=$GITHUB_WORKSPACE/.conan2" >> $GITHUB_ENV
      shell: bash

    - name: Cache Conan (macOS)
      if: runner.os == 'macOS'
      uses: actions/cache@v5
      with:
        path: ${{ env.CONAN_HOME }}
        key: conan-${{ runner.os }}-${{ runner.arch }}-${{ env.MIFROST_MACOSX_DEPLOYMENT_TARGET }}-${{ hashFiles('conanfile.py', 'conandata.yml', 'conan_export.py') }}
        restore-keys: |
          conan-${{ runner.os }}-${{ runner.arch }}-${{ env.MIFROST_MACOSX_DEPLOYMENT_TARGET }}-

    - name: Set min macOS version
      if: runner.os == 'macOS'
      run: |
        echo "MACOSX_DEPLOYMENT_TARGET=${MIFROST_MACOSX_DEPLOYMENT_TARGET}" >> $GITHUB_ENV

    - name: Install build tools
      run: |
        python -m pip install --upgrade pip
        python -m pip install conan pytest

    - name: Configure Conan macOS deployment target
      if: runner.os == 'macOS'
      run: |
        conan profile detect --force
        conan profile update settings.os.version=${MACOSX_DEPLOYMENT_TARGET} default
        conan profile update conf.tools.apple:deployment_target=${MACOSX_DEPLOYMENT_TARGET} default

    - name: Build and install
      run: |
        python -m pip install --verbose .

    - name: Test
      run: python -m pytest
