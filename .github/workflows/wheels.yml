name: Wheel Builds

on:
  pull_request:
  push:
    branches:
      - "**"
    tags:
      - "v*"

env:
  MIFROST_MACOSX_DEPLOYMENT_TARGET: "11.0"

jobs:
  build_sdist:
    name: Build Source Distribution
    needs: [generate_stubs]
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
      with:
        submodules: true

    - name: Download generated stubs
      uses: actions/download-artifact@v7
      with:
        name: mifrost-stubs
        path: src/mifrost

    - name: Validate stub file
      run: |
        python scripts/validate_generated_stub.py src/mifrost/_core.pyi
        python scripts/validate_generated_stub.py src/mifrost/_neutral_core.pyi
        python scripts/validate_generated_stub.py src/mifrost/_pymimir_adapter.pyi
        python scripts/validate_generated_stub.py src/mifrost/_pytyr_adapter.pyi

    - name: Build SDist
      run: pipx run build --sdist

    - name: Check metadata
      run: pipx run twine check dist/*

    - uses: actions/upload-artifact@v6
      with:
        name: dist-sdist
        path: dist/*.tar.gz

  generate_stubs:
    name: Generate Stubs
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
      with:
        submodules: true

    - uses: actions/setup-python@v6
      with:
        python-version: "3.12"

    - name: Set Conan cache dir
      run: echo "CONAN_HOME=$GITHUB_WORKSPACE/.conan2_stubs" >> $GITHUB_ENV
      shell: bash

    - name: Restore Conan cache
      id: conan_cache_restore
      uses: actions/cache/restore@v5
      with:
        path: ${{ env.CONAN_HOME }}
        key: conan-stubs-${{ runner.os }}-${{ runner.arch }}-${{ env.MIFROST_MACOSX_DEPLOYMENT_TARGET }}-${{ hashFiles('conanfile.py', 'conandata.yml', 'conan_export.py', 'dependencies/**/conanfile.py', '.github/workflows/wheels.yml') }}
        restore-keys: |
          conan-stubs-${{ runner.os }}-${{ runner.arch }}-${{ env.MIFROST_MACOSX_DEPLOYMENT_TARGET }}-

    - name: Install build deps
      run: |
        python -m pip install --upgrade pip
        python -m pip install -r requirements/build.txt -r requirements.txt

    - name: Initialize Conan profile
      run: |
        conan profile detect --force

    - name: Configure build
      id: configure_stubs
      run: |
        python configure.py --mode stubs --backends both

    - name: Generate nanobind stubs
      run: |
        python cbuild.py --mode stubs

    - name: Validate generated stubs
      run: |
        python scripts/validate_generated_stub.py src/mifrost/_core.pyi
        python scripts/validate_generated_stub.py src/mifrost/_neutral_core.pyi
        python scripts/validate_generated_stub.py src/mifrost/_pymimir_adapter.pyi
        python scripts/validate_generated_stub.py src/mifrost/_pytyr_adapter.pyi

    - name: Upload generated stubs
      uses: actions/upload-artifact@v6
      with:
        name: mifrost-stubs
        path: src/mifrost/_*.pyi
        if-no-files-found: error

    - name: Save Conan cache
      if: always() && steps.conan_cache_restore.outcome == 'success' && steps.configure_stubs.outcome == 'success'
      uses: actions/cache/save@v5
      with:
        path: ${{ env.CONAN_HOME }}
        key: ${{ steps.conan_cache_restore.outputs.cache-primary-key }}


  build_wheels:
    name: Build Wheels (${{ matrix.os }} / ${{ matrix.flavor }})
    needs: [generate_stubs]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            flavor: manylinux
            backend: both
            test_requires: "pymimir>=0.13.60 pytyr>=0.0.30"
            conan_home_dir: .conan2_wheels_manylinux
            cibw_build: "cp312-manylinux_* cp313-manylinux_* cp314-manylinux_*"
            cibw_skip: "cp314t-*"
          - os: ubuntu-latest
            flavor: musllinux
            backend: both
            test_requires: "pymimir>=0.13.60 pytyr>=0.0.30"
            conan_home_dir: .conan2_wheels_musllinux
            cibw_build: "cp312-musllinux_* cp313-musllinux_* cp314-musllinux_*"
            cibw_skip: "cp314t-*"
          - os: macos-latest
            flavor: macos
            backend: both
            test_requires: "pymimir>=0.13.60 pytyr>=0.0.30"
            conan_home_dir: .conan2_wheels_macos
            cibw_build: "cp312-* cp313-* cp314-*"
            cibw_skip: "cp314t-*"
          - os: ubuntu-latest
            flavor: manylinux-core
            backend: core
            test_requires: ""
            conan_home_dir: .conan2_wheels_manylinux
            cibw_build: "cp312-manylinux_*"
            cibw_skip: ""
          - os: ubuntu-latest
            flavor: manylinux-pymimir
            backend: pymimir
            test_requires: "pymimir>=0.13.60"
            conan_home_dir: .conan2_wheels_manylinux
            cibw_build: "cp312-manylinux_*"
            cibw_skip: ""
          - os: ubuntu-latest
            flavor: manylinux-pytyr
            backend: pytyr
            test_requires: "pytyr>=0.0.30"
            conan_home_dir: .conan2_wheels_manylinux
            cibw_build: "cp312-manylinux_*"
            cibw_skip: ""
          - os: ubuntu-latest
            flavor: musllinux-core
            backend: core
            test_requires: ""
            conan_home_dir: .conan2_wheels_musllinux
            cibw_build: "cp312-musllinux_*"
            cibw_skip: ""
          - os: ubuntu-latest
            flavor: musllinux-pymimir
            backend: pymimir
            test_requires: "pymimir>=0.13.60"
            conan_home_dir: .conan2_wheels_musllinux
            cibw_build: "cp312-musllinux_*"
            cibw_skip: ""
          - os: ubuntu-latest
            flavor: musllinux-pytyr
            backend: pytyr
            test_requires: "pytyr>=0.0.30"
            conan_home_dir: .conan2_wheels_musllinux
            cibw_build: "cp312-musllinux_*"
            cibw_skip: ""
          - os: macos-latest
            flavor: macos-core
            backend: core
            test_requires: ""
            conan_home_dir: .conan2_wheels_macos
            cibw_build: "cp312-*"
            cibw_skip: ""
          - os: macos-latest
            flavor: macos-pymimir
            backend: pymimir
            test_requires: "pymimir>=0.13.60"
            conan_home_dir: .conan2_wheels_macos
            cibw_build: "cp312-*"
            cibw_skip: ""
          - os: macos-latest
            flavor: macos-pytyr
            backend: pytyr
            test_requires: "pytyr>=0.0.30"
            conan_home_dir: .conan2_wheels_macos
            cibw_build: "cp312-*"
            cibw_skip: ""

    steps:
    - uses: actions/checkout@v6
      with:
        submodules: true

    - uses: actions/setup-python@v6
      with:
        python-version: "3.12"

    - name: Download generated stubs
      uses: actions/download-artifact@v7
      with:
        name: mifrost-stubs
        path: src/mifrost

    - name: Validate stub file
      run: |
        python scripts/validate_generated_stub.py src/mifrost/_core.pyi
        python scripts/validate_generated_stub.py src/mifrost/_neutral_core.pyi
        python scripts/validate_generated_stub.py src/mifrost/_pymimir_adapter.pyi
        python scripts/validate_generated_stub.py src/mifrost/_pytyr_adapter.pyi

    - name: Set cache dirs
      run: |
        echo "CONAN_HOME=$GITHUB_WORKSPACE/${{ matrix.conan_home_dir }}" >> $GITHUB_ENV
        echo "CIBW_CACHE_PATH=$GITHUB_WORKSPACE/.cibuildwheel_cache" >> $GITHUB_ENV
      shell: bash

    - name: Cache cibuildwheel
      uses: actions/cache@v5
      with:
        path: ${{ env.CIBW_CACHE_PATH }}
        key: cibw-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pyproject.toml') }}
        restore-keys: |
          cibw-${{ runner.os }}-${{ runner.arch }}-

    - name: Restore Conan cache
      id: conan_cache_restore
      uses: actions/cache/restore@v5

      with:
        path: ${{ env.CONAN_HOME }}
        key: conan-wheel-${{ matrix.flavor }}-${{ runner.os }}-${{ runner.arch }}-${{ env.MIFROST_MACOSX_DEPLOYMENT_TARGET }}-${{ hashFiles('conanfile.py', 'conandata.yml', 'conan_export.py', '.github/workflows/wheels.yml') }}
        restore-keys: |
          conan-wheel-${{ matrix.flavor }}-${{ runner.os }}-${{ runner.arch }}-${{ env.MIFROST_MACOSX_DEPLOYMENT_TARGET }}-

    - uses: pypa/cibuildwheel@v3.3
      id: build_wheels_step
      env:
        CIBW_BUILD: ${{ matrix.cibw_build }}
        CIBW_SKIP: ${{ matrix.cibw_skip }}
        CIBW_TEST_REQUIRES: ${{ matrix.test_requires }}
        CIBW_CACHE_PATH: ${{ env.CIBW_CACHE_PATH }}
        CIBW_TEST_COMMAND: python {project}/scripts/smoke_installed_wheel.py
        CIBW_BEFORE_BUILD_LINUX: rm -rf /project/build && python -m pip install -r /project/requirements/base-build.txt
        CIBW_BEFORE_BUILD_MACOS: python -m pip install -r {project}/requirements/base-build.txt && python -m pip install delocate
        CIBW_REPAIR_WHEEL_COMMAND_LINUX: python {project}/scripts/repair_wheel.py {wheel} {dest_dir}
        CIBW_REPAIR_WHEEL_COMMAND_MACOS: python {project}/scripts/repair_wheel.py {wheel} {dest_dir}
        CIBW_CONTAINER_ENGINE_OPTIONS: --volume ${{ env.CONAN_HOME }}:/conan_home
        CIBW_ENVIRONMENT_PASS_LINUX: MIFROST_BUILD_BACKENDS
        CIBW_ENVIRONMENT_MACOS: CONAN_HOME=${{ env.CONAN_HOME }} MACOSX_DEPLOYMENT_TARGET=${{ env.MIFROST_MACOSX_DEPLOYMENT_TARGET }} CONAN_NON_INTERACTIVE=1 MIFROST_BUILD_BACKENDS=${{ matrix.backend }}
        MIFROST_BUILD_BACKENDS: ${{ matrix.backend }}

    - name: Verify clean directory
      run: git diff --exit-code -- . ':(exclude)src/mifrost/_core.pyi'
      shell: bash

    - name: Save Conan cache
      if: always() && steps.conan_cache_restore.outcome == 'success' && steps.build_wheels_step.outcome == 'success'
      uses: actions/cache/save@v5
      with:
        path: ${{ env.CONAN_HOME }}
        key: ${{ steps.conan_cache_restore.outputs.cache-primary-key }}

    - name: Verify wheel artifacts
      shell: bash
      run: |
        set -euo pipefail
        ls -lh wheelhouse
        python -m pip install --upgrade pip
        python -m pip install twine
        python -m twine check wheelhouse/*.whl
        python - <<'PY'
        import glob
        import pathlib
        import zipfile
        import email

        wheels = sorted(glob.glob("wheelhouse/*.whl"))
        if not wheels:
            raise SystemExit("No wheels were produced in wheelhouse/")

        for wheel in wheels:
            wheel_path = pathlib.Path(wheel)
            with zipfile.ZipFile(wheel_path) as zf:
                names = set(zf.namelist())
                has_neutral_ext = any(
                    name.startswith("mifrost/_neutral_core")
                    and (name.endswith(".so") or name.endswith(".dylib"))
                    for name in names
                )
                if not has_neutral_ext:
                    raise SystemExit(f"{wheel_path.name}: missing mifrost/_neutral_core extension")
                if "mifrost/_neutral_core.pyi" not in names:
                    raise SystemExit(f"{wheel_path.name}: missing mifrost/_neutral_core.pyi")
                if "mifrost/include/mifrost/core/batch_builder.hpp" not in names:
                  raise SystemExit(f"{wheel_path.name}: missing mifrost SDK headers")
                if "mifrost/lib/cmake/mifrost/mifrostConfig.cmake" not in names:
                  raise SystemExit(f"{wheel_path.name}: missing mifrost CMake package config")
                if "mifrost/lib/cmake/mifrost/mifrostTargets.cmake" not in names:
                  raise SystemExit(f"{wheel_path.name}: missing mifrost exported targets")

                if "mifrost/include/mifrost/core/map_view.hpp" in names:
                  raise SystemExit(f"{wheel_path.name}: still ships internal Python-only SDK headers")

                has_neutral_sdk_lib = any(
                  name.startswith("mifrost/lib/")
                  and pathlib.PurePosixPath(name).name.startswith("libmifrost_neutral_core")
                  for name in names
                )
                if not has_neutral_sdk_lib:
                  raise SystemExit(f"{wheel_path.name}: missing reusable neutral core library")

                config_text = zf.read("mifrost/lib/cmake/mifrost/mifrostConfig.cmake").decode()
                with_pymimir = "set(mifrost_WITH_PYMIMIR_ADAPTER ON)" in config_text
                with_pytyr = "set(mifrost_WITH_PYTYR_ADAPTER ON)" in config_text
                if "find_dependency(nanobind" in config_text:
                  raise SystemExit(f"{wheel_path.name}: still exports nanobind as an SDK dependency")

                def has_extension(stem):
                    return any(
                        name.startswith(f"mifrost/{stem}")
                        and (name.endswith(".so") or name.endswith(".dylib"))
                        for name in names
                    )

                if has_extension("_pymimir_adapter") != with_pymimir:
                    raise SystemExit(f"{wheel_path.name}: Pymimir extension/config mismatch")
                if has_extension("_pytyr_adapter") != with_pytyr:
                    raise SystemExit(f"{wheel_path.name}: PyTyr extension/config mismatch")
                if ("mifrost/_pymimir_adapter.pyi" in names) != with_pymimir:
                    raise SystemExit(f"{wheel_path.name}: Pymimir stub/config mismatch")
                if ("mifrost/_pytyr_adapter.pyi" in names) != with_pytyr:
                    raise SystemExit(f"{wheel_path.name}: PyTyr stub/config mismatch")
                if ("mifrost/_core.pyi" in names) != with_pymimir:
                    raise SystemExit(f"{wheel_path.name}: compatibility stub/config mismatch")

                targets_text = zf.read("mifrost/lib/cmake/mifrost/mifrostTargets.cmake").decode()
                if "nanobind::nanobind" in targets_text:
                  raise SystemExit(f"{wheel_path.name}: still links nanobind publicly in exported targets")
                if ".conan" in targets_text:
                  raise SystemExit(f"{wheel_path.name}: leaked Conan paths in exported targets")

                metadata_name = next(
                    (n for n in names if n.endswith(".dist-info/METADATA")),
                    None,
                )
                if metadata_name is None:
                    raise SystemExit(f"{wheel_path.name}: missing dist-info METADATA")
                metadata = email.message_from_bytes(zf.read(metadata_name))
                requires = metadata.get_all("Requires-Dist", [])
                optional_backends = {
                    req.split(";", 1)[0].strip().split(" ", 1)[0].split(">", 1)[0].lower()
                    for req in requires
                    if "extra ==" in req
                }
                if not {"pymimir", "pytyr"}.issubset(optional_backends):
                    raise SystemExit(
                        f"{wheel_path.name}: missing optional backend metadata: "
                        f"{sorted(optional_backends)}"
                    )

            print(f"validated: {wheel_path.name}")
        PY

    - name: Upload wheels
      if: matrix.backend == 'both'
      uses: actions/upload-artifact@v6
      with:
        path: wheelhouse/*.whl
        name: dist-${{ matrix.os }}-${{ matrix.flavor }}

  upload_all:
    name: Publish Wheels (PyPI)
    needs: [upload_testpypi]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: read
      id-token: write

    steps:
    - uses: actions/setup-python@v6
    - uses: actions/download-artifact@v7
      with:
        path: dist
        pattern: dist-*
        merge-multiple: true

    - uses: pypa/gh-action-pypi-publish@release/v1

  upload_testpypi:
    name: Publish Wheels (TestPyPI)
    needs: [build_wheels, build_sdist]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: read
      id-token: write

    steps:
    - uses: actions/setup-python@v6
    - uses: actions/download-artifact@v7
      with:
        path: dist
        pattern: dist-*
        merge-multiple: true

    - uses: pypa/gh-action-pypi-publish@release/v1
      with:
        repository-url: https://test.pypi.org/legacy/

  create_release:
    name: Create GitHub Release
    needs: [upload_all]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write

    steps:
    - name: Create release from tag
      env:
        GH_TOKEN: ${{ github.token }}
        GH_REPO: ${{ github.repository }}
      run: |
        VERSION="${GITHUB_REF_NAME#v}"
        NOTES=$(printf '%s\n' \
          "Wheels for \`mifrost\` ${VERSION} were built, validated, and published from GitHub Actions." \
          "" \
          "Package pages:" \
          "- https://pypi.org/project/mifrost/${VERSION}/" \
          "- https://test.pypi.org/project/mifrost/${VERSION}/")
        gh release create "${GITHUB_REF_NAME}" \
          --title "${GITHUB_REF_NAME}" \
          --generate-notes \
          --notes "$NOTES" \
          --verify-tag \
          --latest
