[build-system]
# Build-time requirements used by isolated PEP 517 builds.
requires = [
    "scikit-build-core>=0.10",
    "cmake>=3.24,<5",
    "conan>=2.4,<3",
    "pymimir>=0.13.60",
    "ninja>=1.11,<2",
    "PyYAML>=6.0,<7",
]
build-backend = "build_backend"
backend-path = ["."]

[project]
name = "mifrost"
version = "0.3.1"
description = "STRIPS states to graph encoding C++ extension module."
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "pymimir>=0.13.60",
]
authors = [
    { name = "Michael Aichmüller", email = "m.aichmueller@gmail.com" },
]
license = "GPL-3.0-only"
license-files = ["LICENSE"]

[project.optional-dependencies]
torch = [
    "torch>=2.2,<3",
    "torch-geometric>=2.7",
    "numpy",
]
test = [
    "pytest>=8.0,<9",
    "torch>=2.2,<3",
    "torch-geometric>=2.7",
    "numpy",
]
perf = [
    "torch>=2.2,<3",
    "numpy",
]
dev = [
    "conan>=2.4,<3",
    "cmake>=3.27,<5",
    "ninja>=1.11,<2",
    "pytest>=8.0,<9",
    "ruff>=0.14.14,<0.15",
    "mypy>=1.14,<2",
    "PyYAML>=6.0,<7",
    "torch>=2.2,<3",
    "numpy",
]

[project.urls]
Homepage = "https://github.com/maichmueller/mifrost"


[tool.scikit-build]
# Protect the configuration against future changes in scikit-build-core
minimum-version = "build-system.requires"

# Setuptools-style build caching in a local directory
build-dir = "build/{wheel_tag}"
# Include the Python package directory in the wheel (src layout)
wheel.packages = ["src/mifrost"]
# nanobind generates the public stub in the source package. Git ignores the
# file, but packaging still needs it, so include it in the sdist; the wheel
# build path then carries the generated stub into the final wheel artifact.
sdist.include = ["src/mifrost/_core.pyi"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 88
extend-exclude = [
    ".conan2*",
    ".venv",
    "build",
    "build_*",
    "cmake-build-*",
    "dist",
    "site",
]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.mypy]
python_version = "3.12"
files = [
    "src/mifrost/encoders/types.py",
    "src/mifrost/graph_fields.py",
    "src/mifrost/schema_keys.py",
    "tests/python/test_public_api_exports.py",
]
ignore_missing_imports = true
allow_redefinition = true
warn_unused_ignores = true

[tool.cibuildwheel]
# Necessary to see build output from the actual compilation
build-verbosity = 1

# Smoke-test that the built wheel can be imported in an isolated venv.
# Full test coverage is provided by the separate CI test workflows, which install
# heavy dependencies (torch, torch_geometric, etc.).
test-command = "python -c \"import pymimir, mifrost; print('pymimir', getattr(pymimir, '__version__', 'unknown')); print('mifrost', mifrost.__file__)\""

# Only build and test wheels for supported Python versions.
build = ["cp312-*", "cp313-*"]

[tool.cibuildwheel.linux.environment]
# Ensure Conan's provider path resolves b2 from source in manylinux/musllinux,
# where prebuilt b2 binaries can be glibc-incompatible.
CMAKE_ARGS = "-DCONAN_INSTALL_ARGS=--build=missing\\;--build=b2/*"
CONAN_NON_INTERACTIVE = "1"
# Use an explicit non-default Conan cache path in wheel containers to avoid
# accidentally consuming pre-existing /root/.conan2 contents.
CONAN_HOME = "/conan_home"

# Needed for full C++17 support
[tool.cibuildwheel.macos.environment]
MACOSX_DEPLOYMENT_TARGET = "11.0"
