[build-system]
# Build-time requirements used by isolated PEP 517 builds.
requires = [
    "scikit-build-core>=0.10",
    "cmake>=3.24,<5",
    "conan>=2.4,<3",
    "ninja>=1.11,<2",
    # Mifrost joins pymimir's nanobind type registry. Keep this in the
    # isolated build environment so CMake resolves the same newer nanobind
    # generation that pymimir uses instead of the removed Conan package.
    "nanobind==2.15.0",
    "PyYAML>=6.0,<7",
]
build-backend = "build_backend"
backend-path = ["."]

[project]
name = "mifrost"
version = "0.6.0"
description = "STRIPS states to graph encoding C++ extension module."
readme = "README.md"
requires-python = ">=3.12"
dependencies = []
authors = [
    { name = "Michael Aichmüller", email = "m.aichmueller@gmail.com" },
]
license = "GPL-3.0-only"
license-files = ["LICENSE"]

[project.optional-dependencies]
pymimir = [
    "pymimir>=0.14.3",
    "torch>=2.2,<3",
    "torch-geometric>=2.7",
    "numpy",
]
pytyr = [
    "pytyr==0.0.34",
    "torch>=2.2,<3",
    "torch-geometric>=2.7",
    "numpy",
]
backends = [
    "pymimir>=0.14.3",
    "pytyr==0.0.34",
    "torch>=2.2,<3",
    "torch-geometric>=2.7",
    "numpy",
]
torch = [
    "torch>=2.2,<3",
    "torch-geometric>=2.7",
    "numpy",
]
test = [
    "pymimir>=0.14.3",
    "pytyr==0.0.34",
    "pytest>=8.0,<9",
    "torch>=2.2,<3",
    "torch-geometric>=2.7",
    "numpy",
]
perf = [
    "pymimir>=0.14.3",
    "pytyr==0.0.34",
    "torch>=2.2,<3",
    "numpy",
]
dev = [
    "conan>=2.4,<3",
    "cmake>=3.27,<5",
    "ninja>=1.11,<2",
    "pytest>=8.0,<9",
    "ruff>=0.14.14,<0.15",
    "mypy>=1.14,<2",
    "PyYAML>=6.0,<7",
    "pymimir>=0.14.3",
    "pytyr==0.0.34",
    "torch>=2.2,<3",
    "numpy",
]

[project.urls]
Homepage = "https://github.com/maichmueller/mifrost"


[tool.scikit-build]
# Protect the configuration against future changes in scikit-build-core
minimum-version = "build-system.requires"

# Setuptools-style build caching in a local directory
build-dir = "build/{wheel_tag}"
# Include the Python package directory in the wheel (src layout)
wheel.packages = ["src/mifrost"]
# nanobind generates the public stub in the source package. Git ignores the
# file, but packaging still needs it, so include it in the sdist; the wheel
# build path then carries the generated stub into the final wheel artifact.
sdist.include = [
    "scripts/install_pymimir_release.py",
    "scripts/resolve_native_prefixes.py",
    "src/mifrost/_core.pyi",
    "src/mifrost/_neutral_core.pyi",
    "src/mifrost/_pymimir_adapter.pyi",
    "src/mifrost/_pytyr_adapter.pyi",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 88
extend-exclude = [
    ".conan2*",
    ".venv",
    "build",
    "build_*",
    "cmake-build-*",
    "dist",
    "site",
]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.mypy]
python_version = "3.12"
files = [
    "src/mifrost/backends",
    "src/mifrost/encoders/_batch_contract.py",
    "src/mifrost/encoders/_derived_visualization.py",
    "src/mifrost/encoders/_visualization.py",
    "src/mifrost/encoders/base.py",
    "src/mifrost/encoders/cross_stack.py",
    "src/mifrost/encoders/custom/__init__.py",
    "src/mifrost/encoders/custom/base.py",
    "src/mifrost/encoders/custom/harness.py",
    "src/mifrost/encoders/custom/state_view.py",
    "src/mifrost/encoders/custom/tables.py",
    "src/mifrost/encoders/custom/writer.py",
    "src/mifrost/encoders/derived_graph_data.py",
    "src/mifrost/encoders/lifted.py",
    "src/mifrost/encoders/object_feature.py",
    "src/mifrost/encoders/types.py",
    "src/mifrost/graph_fields.py",
    "src/mifrost/schema_keys.py",
    "tests/python/test_public_api_exports.py",
]
ignore_missing_imports = true
allow_redefinition = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = [
    "mifrost._neutral_core",
    "mifrost._pymimir_adapter",
    "mifrost._pytyr_adapter",
]
# These stubs are generated from nanobind runtime signatures. They are valid
# editor/API artifacts but contain third-party native annotations that are not
# intended to be type-checked as part of the handwritten Python facade.
follow_imports = "skip"
ignore_errors = true

[tool.cibuildwheel]
# Necessary to see build output from the actual compilation
build-verbosity = 1

# Smoke-test that the built wheel can be imported in an isolated venv.
# Full test coverage is provided by the separate CI test workflows, which install
# heavy dependencies (torch, torch_geometric, etc.).
test-command = "python -c \"import mifrost; print('mifrost', mifrost.__file__)\""

build = ["cp312-*", "cp313-*"]
test-skip = "cp314t-*"

[tool.cibuildwheel.linux.environment]
# Ensure Conan's provider path resolves b2 from source in manylinux/musllinux,
# where prebuilt b2 binaries can be glibc-incompatible.
CMAKE_ARGS = "-DCONAN_INSTALL_ARGS=--build=missing\\;--build=b2/*"
CONAN_NON_INTERACTIVE = "1"
# Use an explicit non-default Conan cache path in wheel containers to avoid
# accidentally consuming pre-existing /root/.conan2 contents.
CONAN_HOME = "/conan_home"

# Needed for full C++17 support
[tool.cibuildwheel.macos.environment]
MACOSX_DEPLOYMENT_TARGET = "11.0"
