[build-system]
requires = [
    "scikit-build-core>=0.10",
    "conan>=2.4",
    "pymimir>=0.13.60",
    "delocate>=0.12; sys_platform == 'darwin'",
]
build-backend = "build_backend"
backend-path = ["."]

[project]
name = "mifrost"
version = "0.0.1"
description = "C++ extension module built with nanobind"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pymimir>=0.13.60",
]
authors = [
    { name = "Michael Aichmüller", email = "m.aichmueller@gmail.com" },
]
license = { text = "GPL-3.0-only" }
classifiers = [
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
]

[project.urls]
Homepage = "https://github.com/maichmueller/mifrost"


[tool.scikit-build]
# Protect the configuration against future changes in scikit-build-core
minimum-version = "build-system.requires"

# Setuptools-style build caching in a local directory
build-dir = "build/{wheel_tag}"
# Include the Python package directory in the wheel (src layout)
wheel.packages = ["src/mifrost"]

[tool.cibuildwheel]
# Necessary to see build output from the actual compilation
build-verbosity = 1

# Run pytest to ensure that the package was correctly built
test-command = "pytest {project}/tests"
test-requires = "pytest"

# Don't test Python 3.8 wheels on macOS/arm64
test-skip="cp38-macosx_*:arm64"

# Needed for full C++17 support
[tool.cibuildwheel.macos.environment]
MACOSX_DEPLOYMENT_TARGET = "11.0"
